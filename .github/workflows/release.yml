name: Build & Release Portable Binary

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Portable (Static CRT)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --locked

      - name: Build release portable executable
        run: cargo build --release --locked

      - name: Package portable binary & SHA-256 checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\reforge.exe dist\Reforge-x64-portable.exe
          $hash = (Get-FileHash dist\Reforge-x64-portable.exe -Algorithm SHA256).Hash
          "$hash  Reforge-x64-portable.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reforge-x64-portable
          path: |
            dist/Reforge-x64-portable.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Reforge-x64-portable.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
